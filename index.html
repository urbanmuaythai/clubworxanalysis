<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubworx Analysis — Urban Muaythai</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8102E;
  --bg:#ffffff;--bg2:#f7f7f6;--bg3:#f1efea;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--border3:rgba(0,0,0,0.35);
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1c;--bg2:#252525;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);--border3:rgba(255,255,255,0.28)}
  .alert{background:#2a1010!important}.alert p{color:#f09595!important}
  .principle-box{background:#2a1010!important}.principle-box p{color:#f09595!important}
  .tag.critical{background:#4a1010!important;color:#f09595!important}
  .tag.moderate{background:#3a2800!important;color:#fac775!important}
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.kb{display:flex;flex:1;overflow:hidden;height:100vh}
.sidebar{width:250px;flex-shrink:0;border-right:0.5px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:16px 14px 13px;border-bottom:0.5px solid var(--border)}
.gym-badge{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.gym-logo{width:32px;height:32px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.gym-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.gym-sub{font-size:11px;color:var(--text3)}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);font-size:12.5px;color:var(--text);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3)}
.nav-scroll{flex:1;overflow-y:auto;padding:4px 0 16px}
.nav-scroll::-webkit-scrollbar{width:4px}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-home{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text2);border-right:2px solid transparent;margin-bottom:2px;border-bottom:0.5px solid var(--border)}
.nav-home:hover{background:var(--bg);color:var(--text)}
.nav-home.active{color:var(--red);font-weight:600;border-right-color:var(--red)}
.cat-block{margin-bottom:1px}
.cat-header{display:flex;align-items:center;gap:8px;padding:8px 14px 5px;cursor:pointer;user-select:none}
.cat-header:hover .cat-label{color:var(--text)}
.cat-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.cat-label{font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);flex:1}
.cat-toggle{font-size:12px;color:var(--text3);transition:transform .2s}
.cat-block.open .cat-toggle{transform:rotate(180deg)}
.cat-items{display:none}
.cat-block.open .cat-items{display:block}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 22px;cursor:pointer;font-size:12.5px;color:var(--text2);border-right:2px solid transparent;transition:background .1s;position:relative}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--bg);color:var(--red);font-weight:600;border-right-color:var(--red)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .1s}
.nav-item.active .nav-dot{background:var(--red)}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.main-inner{max-width:660px;padding:32px 36px 56px}
.page-tag{font-size:11px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;margin-bottom:8px}
.page-title{font-size:26px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.2}
.page-desc{font-size:14.5px;color:var(--text2);line-height:1.65;margin-bottom:22px}
.divider{height:0.5px;background:var(--border);margin-bottom:22px}
.meta-row{display:flex;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.meta-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2)}
.meta-pill i{font-size:15px;color:var(--text3)}
.section-title{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin:20px 0 10px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;cursor:pointer;transition:border-color .15s}
.cat-card:hover{border-color:var(--border3)}
.cat-card-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.cat-card-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-card-name{font-size:13.5px;font-weight:600;color:var(--text)}
.cat-card-desc{font-size:12px;color:var(--text2);line-height:1.5}
.cat-card-count{font-size:11px;color:var(--text3);margin-top:6px}
.cat-page-header{display:flex;align-items:center;gap:13px;padding:16px 18px;border-radius:var(--radius-lg);margin-bottom:18px;border:0.5px solid transparent}
.cat-page-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;background:rgba(255,255,255,0.25)}
.cat-page-name{font-size:19px;font-weight:600}
.cat-page-desc{font-size:13px;margin-top:2px;opacity:0.75}
.step-link{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.step-link:hover{border-color:var(--border3)}
.step-link-left{display:flex;align-items:center;gap:11px}
.step-num{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.step-link-title{font-size:13.5px;font-weight:600;color:var(--text)}
.step-link-desc{font-size:12px;color:var(--text2);margin-top:2px}
.step-link i.arr{font-size:16px;color:var(--text3)}
.step-block{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:10px}
.checklist{list-style:none}
.checklist li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13.5px;color:var(--text);line-height:1.55}
.checklist li:last-child{border-bottom:none}
.checklist li i.ci{font-size:15px;flex-shrink:0;margin-top:2px}
.alert{background:#fff5f5;border:0.5px solid #f09595;border-left:3px solid var(--red);border-radius:var(--radius);padding:12px 14px;margin-top:13px}
.alert-head{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.alert p{font-size:13px;color:#791F1F;line-height:1.65}
.tip-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px;margin-top:10px;display:flex;gap:10px}
.tip-box i{font-size:17px;color:var(--red);flex-shrink:0;margin-top:1px}
.tip-box p{font-size:13px;color:var(--text2);line-height:1.6}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.info-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px}
.info-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.info-card-title i{font-size:16px;color:var(--red)}
.info-card p{font-size:12.5px;color:var(--text2);line-height:1.6}
.error-table{width:100%;border-collapse:collapse;font-size:13px}
.error-table th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text3);padding:8px 12px;border-bottom:0.5px solid var(--border)}
.error-table td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:top;line-height:1.5}
.error-table tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600}
.tag.critical{background:#fde8ec;color:#9e0c24}
.tag.moderate{background:#fef3e2;color:#7a4a00}
.principle-box{border-left:3px solid var(--red);padding:14px 18px;background:#fff5f5;border-radius:0 var(--radius) var(--radius) 0;margin-top:22px}
.principle-box p{font-size:13.5px;color:#791F1F;line-height:1.75}
.escalate-table{width:100%;border-collapse:collapse;font-size:13px}
.escalate-table th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text3);padding:8px 12px;border-bottom:0.5px solid var(--border)}
.escalate-table td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:top;line-height:1.5}
.escalate-table tr:last-child td{border-bottom:none}
.urgency-now{display:inline-flex;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;background:#fde8ec;color:#9e0c24}
.urgency-week{display:inline-flex;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;background:#fef3e2;color:#7a4a00}
.sub-section{margin-bottom:14px;border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.sub-section-header{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--bg2);border-bottom:0.5px solid var(--border)}
.sub-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-icon i{font-size:15px}
.sub-title{font-size:13px;font-weight:600;color:var(--text)}
.sub-section .checklist{padding:4px 15px 8px}
.sub-section .alert,.sub-section .tip-box{margin:0 15px 12px}
.nav-footer{display:flex;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:0.5px solid var(--border)}
.nav-footer button{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 13px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:background .1s}
.nav-footer button:hover{background:var(--bg2);color:var(--text)}

/* Reading layout and responsive navigation */
:root{--bg:#fff;--bg2:#f5f7fb;--bg3:#eaf0f6;--text:#152239;--text2:#526078;--text3:#64748b;--border:#e0e6ef;--border2:#c5cfde;--radius:10px;--radius-lg:16px}
body{color-scheme:light;font-size:15px}
.sidebar{width:300px;background:#111f35;color:#fff;border:0}
.sidebar-top{padding:24px 20px;border-color:#ffffff20}
.gym-logo{width:42px;height:42px;border-radius:12px;box-shadow:0 5px 20px #0002}
.gym-name{color:#fff;font-size:15px}.gym-sub{color:#b5c1d3;font-size:12px}
.search-wrap input{padding:11px 12px 11px 34px;font-size:14px;border:1px solid #ffffff35;background:#ffffff0d;color:#fff}
.search-wrap input::placeholder{color:#b5c1d3}.search-wrap i{color:#b5c1d3}
.nav-scroll{padding:10px 10px 24px}.nav-home,.nav-item{border:0;border-radius:8px;margin:2px 0;padding:10px 12px;color:#c8d3e4;font-size:13px;line-height:1.45}
.nav-home:hover,.nav-item:hover{background:#ffffff0c;color:#fff}.nav-home.active,.nav-item.active{background:#ffffff16;color:#fff;box-shadow:inset 3px 0 var(--red)}
.cat-header{padding:16px 10px 7px}.cat-label{color:#9fb0c9;font-size:10px}.cat-header:hover .cat-label{color:#fff}.cat-toggle{color:#9fb0c9}.nav-dot{background:#71829c}.nav-item.active .nav-dot{background:#ff617b}
.main{background:#f5f7fb}.main-inner{max-width:1100px;margin:auto;padding:42px 48px 64px}.page-title{font-size:clamp(26px,3vw,38px);font-weight:750;letter-spacing:-.035em}.page-desc{font-size:16px;max-width:780px;line-height:1.8}.page-tag{font-size:11px;margin-bottom:12px}
.meta-row{gap:10px}.meta-pill{background:white;padding:9px 12px;border:1px solid var(--border);border-radius:8px}
.section-title{font-size:11px;margin:28px 0 12px;color:#526078}.cat-grid{gap:16px}.cat-card,.info-card{background:#fff;border:1px solid var(--border);padding:20px;box-shadow:0 3px 12px #14213a04}
.cat-card:hover,.step-link:hover{border-color:#a8b7cd;box-shadow:0 8px 24px #14213a0c;transform:translateY(-2px)}.cat-card{transition:transform .15s,box-shadow .15s}.cat-card-name{font-size:16px}.cat-card-desc,.info-card p{font-size:13.5px;line-height:1.7}.cat-card-count{font-size:12px;margin-top:12px}.cat-card-icon{width:38px;height:38px}.info-row{gap:16px}
.step-block,.sub-section,.step-link,.tip-box{background:#fff;border:1px solid var(--border)}.step-block{padding:22px}.sub-section-header{padding:16px 20px}.sub-title{font-size:15px}.sub-section .checklist{padding:8px 20px 16px}.checklist li{font-size:14.5px;padding:11px 0;line-height:1.75}.alert{background:#fff5f5!important}.alert p,.principle-box p{color:#791f1f!important}.principle-box{background:#fff5f5!important}.tag.critical{background:#fde8ec!important;color:#9e0c24!important}.tag.moderate{background:#fef3e2!important;color:#7a4a00!important}.tip-box p,.alert p{font-size:14px}
.step-link{padding:16px 20px;transition:transform .15s,box-shadow .15s}.step-link-title{font-size:15px}.step-link-desc{font-size:13px;line-height:1.5}.error-table,.escalate-table{font-size:14px;min-width:520px}.error-table th,.escalate-table th{padding:13px 16px}.error-table td,.escalate-table td{padding:14px 16px}.step-block:has(table){overflow:auto!important}.nav-footer{gap:12px}.nav-footer button{background:white;line-height:1.45;text-align:left;padding:11px 14px}
.mobile-menu{display:none}.utility-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}.utility-row button,.utility-row a{font:600 12px inherit;font-size:12px;color:#526078;background:white;border:1px solid var(--border);border-radius:8px;padding:10px 13px;cursor:pointer;text-decoration:none}.utility-row a{background:#152239;color:#fff;border-color:#152239}.search-feedback{font-size:12px;color:#c8d3e4;padding:10px 4px}.search-feedback:empty{display:none}
[role=button]:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e59a23;outline-offset:3px}
@media(max-width:760px){.kb{flex-direction:column}.sidebar{width:100%;max-height:60vh;flex-shrink:0}.sidebar-top{padding:14px 18px}.gym-badge{margin-bottom:10px}.gym-logo{width:34px;height:34px}.mobile-menu{display:block;margin-left:auto;border:1px solid #ffffff35;background:transparent;color:white;border-radius:8px;padding:8px 12px}.nav-scroll{display:none;max-height:35vh}.sidebar.menu-open .nav-scroll{display:block}.main-inner{padding:24px 18px 44px}.cat-grid,.info-row{grid-template-columns:1fr}.page-desc{font-size:14.5px}.meta-pill{font-size:11px}.nav-footer{flex-direction:column}.step-block{padding:16px}.sub-section .checklist{padding:6px 16px 12px}.checklist li{font-size:14px}.utility-row{margin-bottom:20px}.main{min-height:0}.page-title{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{html,body,.kb,.main{height:auto;overflow:visible;display:block}.sidebar,.utility-row,.nav-footer{display:none}.main-inner{padding:0;max-width:none}.step-block,.sub-section{break-inside:avoid}}


/* Keep the page top bar visible inside the page and Google Sites embeds. */
.utility-row{position:sticky;top:0;z-index:60;isolation:isolate;box-shadow:0 5px 18px #0002}html{scroll-padding-top:var(--sticky-height,100px)}[id]{scroll-margin-top:12px}.utility-row{padding:12px 0;background:#f5f7fb}.main{scroll-padding-top:var(--sticky-height,100px)}
@media print{.utility-row{position:static;box-shadow:none}}
</style>
</head>
<body>
<div class="kb">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="gym-badge">
        <div class="gym-logo">UM</div>
        <div>
          <div class="gym-name">Urban Muaythai</div>
          <div class="gym-sub">Clubworx Analysis</div>
        </div>
        <button class="mobile-menu" onclick="toggleMenu()" aria-expanded="false" aria-controls="analysis-navigation">Browse</button>
      </div>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" aria-label="Search Clubworx procedures" id="search-input" placeholder="Search the analysis..." oninput="filterNav(this.value)">
      </div>
    </div>
    <div class="nav-scroll" id="analysis-navigation" aria-label="Analysis procedures"><div id="search-feedback" class="search-feedback" aria-live="polite"></div>
      <div class="nav-home active" id="nav-home" onclick="showHome()">
        <i class="ti ti-home" style="font-size:15px"></i> Home
      </div>
      <div id="nav-cats"></div>
    </div>
  </div>
  <div class="main">
    <div class="main-inner"><div class="utility-row"><button onclick="showHome()">Overview</button><button onclick="showStep('new-members','access-activity')">Start activity review</button><button onclick="showStep('accountability','completion-log')">Daily completion log</button><a href="https://app.clubworx.com/gyms/2519/dashboard" target="_blank" rel="noopener noreferrer">Open Clubworx ↗</a></div><div id="main-content" aria-live="polite"></div></div>
  </div>
</div>
<script>
const cats = [
  {
    id:'member-management',
    label:'Member Management',
    icon:'ti-users',
    color:'#185FA5',
    bg:'#dceefb',
    desc:'Keeping active member records, memberships, and billing accurate every day.',
    steps:[
      {
        id:'review-memberships',num:2,title:'Review membership activity',isNew:false,
        short:'Audit every membership applied yesterday',
        why:'Memberships are the core revenue driver. Any error here directly affects billing, member experience, and financial reporting.',
        items:[
          'Filter activity to Memberships in Recent Activity',
          'Confirm the correct membership type has been selected',
          'Confirm the Clubworx membership start date matches the member\'s actual first attendance',
          'If the member started later than planned, update both Clubworx and the New Member Spreadsheet',
          'Confirm the payment schedule matches what the member agreed to',
          'Confirm every never-ending membership has a recurring payment schedule',
          'For Kickstarter upfront payments, confirm the weekly direct debit begins immediately after the upfront period',
          'Compare the recurring payment start date against the waiver, membership agreement, and New Member Spreadsheet',
          'Confirm notes explain the action taken',
          'Confirm the membership aligns with what was sold',
          'Do not rely only on what another staff member entered — independently verify the complete setup',
          'If any error found: correct immediately',
          'If debit day is wrong: remove and reapply with the correct schedule'
        ],
        alert:'A never-ending membership without a recurring payment schedule can allow a member to continue training without future payments being collected.',
        errors:[
          {type:'Missing recurring payment schedule',impact:'Future payments are not collected',severity:'critical'},
          {type:'Incorrect recurring debit start',impact:'Member is charged early, late, or not at all',severity:'critical'},
          {type:'Membership start date does not match first attendance',impact:'Incorrect program timeline and rollover date',severity:'critical'}
        ],
        tip:'When in doubt about what was sold, check the member conversation or ask the salesperson before correcting.'
      },
      {
        id:'cancellations',num:'C',title:'Cancellations review',isNew:false,
        short:'Verify the dates, notice period, member communication, and Clubworx record',
        why:'Every cancellation must be processed against the correct membership status and leave a complete, dated record. This protects billing accuracy, prevents confusing automated messages, and makes the final payment and end date clear to both the member and the team.',
        sections:[
          {
            title:'Review every cancellation',
            icon:'ti-clipboard-check',
            items:[
              'In Recent Activity, filter to Cancellations for the review date',
              'Confirm the cancellation reason and request date are recorded in Clubworx notes',
              'Confirm the standard notice period has been applied correctly',
              'Confirm the last payment date and membership end date are correct',
              'Confirm the cancellation is entered in the Daily Numbers Spreadsheet',
              'If the member is a current Kickstarter: flag immediately and update the New Member Spreadsheet',
              'Check whether the cancellation triggers a Red Flag and update the Red Flag Tracker if required'
            ]
          },
          {
            title:'Cancellation while on suspension',
            icon:'ti-calendar-cancel',
            items:[
              'End the suspension on the date the cancellation request is received',
              'Apply the standard notice period from that date — the notice period applies to an active membership',
              'Do not leave the member suspended while waiting to process the cancellation',
              'Check and adjust any automation affected by the suspension ending or cancellation timeline'
            ],
            alert:'Leaving a member suspended too long can trigger an automated “coming off suspension” message and confuse the member. Process the status change on the request date.'
          },
          {
            title:'Kickstarter minimum-payment commitments',
            icon:'ti-credit-card-pay',
            items:[
              'Check whether the member still has minimum Kickstarter payments remaining',
              'Do not apply a cancellation in a way that bypasses the minimum-payment commitment',
              'Clearly explain any remaining required payment before confirming the cancellation',
              'State the remaining amount or payment date and request confirmation that the deduction can proceed',
              'Record the member\'s response in Clubworx notes'
            ],

function buildNav(){
  const container=document.getElementById('nav-cats');
  cats.forEach(cat=>{
    const block=document.createElement('div');
    block.className='cat-block open';
    block.id='cat-block-'+cat.id;
    const items=cat.steps.map(step=>`
      <div class="nav-item" id="nav-${step.id}"
           onclick="showStep('${cat.id}','${step.id}')"
           data-search="${step.title.toLowerCase()} ${cat.label.toLowerCase()} ${(step.short||'').toLowerCase()}">
        <div class="nav-dot"></div>
        <span style="flex:1">${step.title}</span>
      </div>`).join('');
    block.innerHTML=`
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <div class="cat-icon" style="background:${cat.bg}">
          <i class="ti ${cat.icon}" style="color:${cat.color};font-size:13px"></i>
        </div>
        <span class="cat-label">${cat.label}</span>
        <i class="ti ti-chevron-down cat-toggle"></i>
      </div>
      <div class="cat-items">${items}</div>`;
    container.appendChild(block);
  });
}

function toggleCat(id){document.getElementById('cat-block-'+id).classList.toggle('open')}

function filterNav(q){
  const lower=q.trim().toLowerCase();let matchCount=0;
  if(!lower){
    document.getElementById('search-feedback').textContent='';
    document.querySelectorAll('.nav-item').forEach(el=>el.style.display='');
    document.querySelectorAll('.cat-block').forEach(el=>el.style.display='');
    return;
  }
  cats.forEach(cat=>{
    let any=false;
    cat.steps.forEach(step=>{
      const el=document.getElementById('nav-'+step.id);
      if(!el)return;
      const m=(cat.label+' '+JSON.stringify(step)).toLowerCase().includes(lower);if(m)matchCount++;
      el.style.display=m?'':'none';
      if(m)any=true;
    });
    const b=document.getElementById('cat-block-'+cat.id);
    if(b){b.style.display=any?'':'none';if(any)b.classList.add('open');}
  });
  document.getElementById('search-feedback').textContent=matchCount?matchCount+' matching procedures':'No matching procedures. Try another word.';
}

function setActive(id){
  document.querySelectorAll('.nav-item,.nav-home').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('nav-'+id)||document.getElementById('nav-home');
  if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

function scrollTop(){document.querySelector('.main').scrollTo(0,0);}

const totalAll=cats.reduce((a,c)=>a+c.steps.length,0);

  setActive('home');scrollTop();navigateTo('');
  document.getElementById('main-content').innerHTML=`
    <div class="page-tag" style="color:var(--red)">Clubworx Analysis</div>
    <div class="page-title">Daily Clubworx Analysis</div>
    <div class="page-desc">A focused daily quality-control workflow for checking Clubworx activity, correcting issues, documenting member communication, and protecting retention.</div>
    <div class="divider"></div>
    <div class="meta-row">
      <div class="meta-pill"><i class="ti ti-clock"></i>Daily</div>
      <div class="meta-pill"><i class="ti ti-user"></i>Reception / Admin</div>
      <div class="meta-pill"><i class="ti ti-layout-grid"></i>${cats.length} Categories</div>
      <div class="meta-pill"><i class="ti ti-file-text"></i>${totalAll} Analysis items</div>
    </div>
    <div class="section-title" style="margin-top:0">Core SOP clarifications</div>

      <div class="info-card" onclick="showStep('tasks-notes','review-notes')" style="cursor:pointer">

        <p>Copy or record email replies in Clubworx notes on the correct date so the full timeline is visible.</p>
      </div>
    </div>
    <div class="section-title" style="margin-top:0">Browse by category</div>
    <div class="cat-grid">
      ${cats.map(cat=>{
        return `
        <div class="cat-card" onclick="showCat('${cat.id}')">
          <div class="cat-card-top">
            <div class="cat-card-icon" style="background:${cat.bg}">
              <i class="ti ${cat.icon}" style="color:${cat.color};font-size:16px"></i>
            </div>
            <div class="cat-card-name">${cat.label}</div>
          </div>
          <div class="cat-card-desc">${cat.desc}</div>
          <div class="cat-card-count">${cat.steps.length} analysis item${cat.steps.length!==1?'s':''}</div>
        </div>`}).join('')}
    </div>
    <div class="principle-box">
      <p><strong>Key principle:</strong> Clubworx Analysis is not admin work. It is quality control, member experience protection, and retention protection. If something is wrong in Clubworx — the member experience breaks, the system breaks, and the results drop.</p>

function showCat(catId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  setActive('home');scrollTop();navigateTo(catId);
  document.getElementById('main-content').innerHTML=`
    <div class="page-tag" style="color:${cat.color}">Category</div>
    <div class="cat-page-header" style="background:${cat.bg};border-color:${cat.bg}">
      <div class="cat-page-icon"><i class="ti ${cat.icon}" style="color:${cat.color}"></i></div>
      <div>
        <div class="cat-page-name" style="color:${cat.color}">${cat.label}</div>
        <div class="cat-page-desc" style="color:${cat.color}">${cat.desc}</div>
      </div>
    </div>
    ${cat.steps.map(step=>`
      <div class="step-link" onclick="showStep('${catId}','${step.id}')">
        <div class="step-link-left">
          <div class="step-num" style="background:${cat.color}">${step.num}</div>
          <div>
            <div class="step-link-title">${step.title}</div>
            <div class="step-link-desc">${step.short}</div>
          </div>
        </div>
        <i class="ti ti-chevron-right arr"></i>
      </div>`).join('')}`;
}

function showStep(catId,stepId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  const step=cat.steps.find(s=>s.id===stepId);if(!step)return;
  setActive(stepId);scrollTop();navigateTo(catId+'/'+stepId);

  let html=`
    <div class="page-tag" style="color:${cat.color}">${cat.label}</div>
    <div class="page-title">${step.title}</div>
    <div class="page-desc">${step.why}</div>
    <div class="divider"></div>`;

  if(step.escalations){
    html+=`<div class="section-title" style="margin-top:0">Escalation trigger reference</div>
    <div class="step-block" style="padding:0;overflow:hidden">
      <table class="escalate-table">
        <thead><tr><th>Situation</th><th>When</th><th>How</th></tr></thead>
        <tbody>${step.escalations.map(e=>`
          <tr>
            <td>${e.trigger}</td>
            <td><span class="${e.when.startsWith('Same')?'urgency-now':'urgency-week'}">${e.when}</span></td>
            <td style="color:var(--text2);font-size:12.5px">${e.how}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="section-title">General rules</div>
    <div class="step-block">
      <ul class="checklist">
        ${(step.items||[]).map(item=>`<li><i class="ti ti-arrow-right ci" style="color:${cat.color}"></i><span>${item}</span></li>`).join('')}
      </ul>
      ${step.alert?`<div class="alert"><div class="alert-head"><i class="ti ti-bolt"></i>Key insight</div><p>${step.alert}</p></div>`:''}
    </div>`;
  } else if(step.sections){
    html+=step.sections.map(sec=>`
      <div class="sub-section">
        <div class="sub-section-header">
          <div class="sub-icon" style="background:${cat.bg}"><i class="ti ${sec.icon}" style="color:${cat.color}"></i></div>
          <div class="sub-title">${sec.title}</div>
        </div>
        <ul class="checklist">
          ${sec.items.map(item=>`<li><i class="ti ti-arrow-right ci" style="color:${cat.color}"></i><span>${item}</span></li>`).join('')}
        </ul>
        ${sec.alert?`<div class="alert"><div class="alert-head"><i class="ti ti-bolt"></i>Important</div><p>${sec.alert}</p></div>`:''}
        ${sec.tip?`<div class="tip-box"><i class="ti ti-bulb"></i><p>${sec.tip}</p></div>`:''}
      </div>`).join('');
  } else {
    html+=`<div class="section-title" style="margin-top:0">What to do</div>`;
    html+=`<div class="step-block">
      <ul class="checklist">
        ${(step.items||[]).map(item=>`<li><i class="ti ti-arrow-right ci" style="color:${cat.color}"></i><span>${item}</span></li>`).join('')}
      </ul>
      ${step.alert?`<div class="alert"><div class="alert-head"><i class="ti ti-bolt"></i>Key insight</div><p>${step.alert}</p></div>`:''}
    </div>`;
  }

  if(step.errors){
    html+=`<div class="section-title">Common errors to watch for</div>
    <div class="step-block" style="padding:0;overflow:hidden">
      <table class="error-table">
        <thead><tr><th>Error</th><th>Impact</th><th>Severity</th></tr></thead>
        <tbody>${step.errors.map(e=>`<tr><td>${e.type}</td><td>${e.impact}</td><td><span class="tag ${e.severity}">${e.severity}</span></td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  if(step.tip){
    html+=`<div class="tip-box"><i class="ti ti-bulb"></i><p>${step.tip}</p></div>`;
  }

  const si=cat.steps.findIndex(s=>s.id===stepId);
  const prev=si>0?cat.steps[si-1]:null;
  const next=si<cat.steps.length-1?cat.steps[si+1]:null;
  html+=`<div class="nav-footer">
    <div>${prev?`<button onclick="showStep('${catId}','${prev.id}')"><i class="ti ti-arrow-left"></i>${prev.title}</button>`:`<button onclick="showCat('${catId}')"><i class="ti ti-arrow-left"></i>Back to ${cat.label}</button>`}</div>
    <div>${next?`<button onclick="showStep('${catId}','${next.id}')">${next.title}<i class="ti ti-arrow-right"></i></button>`:''}</div>
  </div>`;

  document.getElementById('main-content').innerHTML=html;
}


function toggleMenu(){const open=document.querySelector('.sidebar').classList.toggle('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded',String(open));}
function navigateTo(path){history.replaceState(null,'',location.pathname+location.search+(path?'#'+path:''));document.querySelector('.sidebar').classList.remove('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false');requestAnimationFrame(enhanceControls);}
function enhanceControls(){document.querySelectorAll('[onclick]:not(button):not(a):not(input)').forEach(el=>{el.setAttribute('role','button');el.tabIndex=0;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}};});}
function restoreRoute(){const [category,step]=location.hash.slice(1).split('/');if(cats.some(c=>c.id===category&&(!step||c.steps.some(s=>s.id===step)))){step?showStep(category,step):showCat(category);}else showHome();}
buildNav();
restoreRoute();
window.addEventListener('hashchange',restoreRoute);

</script>
